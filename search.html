<!-- Theme toggle -->
<script>
(function(){
  function applyTheme(t){
    if(t==='light'){document.documentElement.setAttribute('data-theme','light');}
    else{document.documentElement.removeAttribute('data-theme');}
    var ic=document.getElementById('themeIcon'),lb=document.getElementById('themeLabel');
    if(ic)ic.textContent=t==='light'?'☀':'🌙';
    if(lb)lb.textContent=t==='light'?'Sáng':'Tối';
  }
  var cur=localStorage.getItem('tvth-theme')||'dark';
  applyTheme(cur);
  var btn=document.getElementById('themeToggle');
  if(btn)btn.addEventListener('click',function(){
    cur=cur==='light'?'dark':'light';
    localStorage.setItem('tvth-theme',cur);
    applyTheme(cur);
  });
})();
</script>

<script>
// Nạp index nhẹ khi có shards; fallback về dataR2/dataBase cho bộ chưa bật shard.
const CFG = window.LIB_CONFIG;
const boList = CFG.boList || [];
const SEARCH_INDEX = new Map();

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = ok;
    s.onerror = () => fail(new Error("Không tải được " + src));
    document.head.appendChild(s);
  });
}

async function loadBookSearchData(b) {
  if (b.shardBase) {
    const r = await fetch(b.shardBase + "/search-index.json");
    if (!r.ok) throw new Error("Search index HTTP " + r.status);
    SEARCH_INDEX.set(b.slug, await r.json());
    return;
  }
  const base = b.dataR2 || b.dataBase || ("data/" + b.slug);
  await Promise.all([
    loadScript(base + "/data.js"),
    loadScript(base + "/cotTruyen.js").catch(() => {})
  ]);
}

async function loadAllData() {
  const results = await Promise.allSettled(boList.map(loadBookSearchData));
  if (results.length && results.every(r => r.status === "rejected")) {
    throw new Error("Không tải được dữ liệu tìm kiếm");
  }
}

function normalize(s) {
  // Simple lowercase + remove diacritics for Vietnamese
  return (s || "").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/đ/g, "d").replace(/Đ/g, "D");
}

function characterSearchResults(book, characters, query) {
  const redirects = characters && characters.redirects && typeof characters.redirects === "object" ? characters.redirects : {};
  const chars = characters && Array.isArray(characters.chars) ? characters.chars : [];
  const byId = new Map(chars.filter(c => c && typeof c.id === "string").map(c => [c.id, c]));
  const emitted = new Set();
  const output = [];
  const resolve = id => {
    const redirect = Object.prototype.hasOwnProperty.call(redirects, id) ? redirects[id] : null;
    if (!redirect) return id;
    if (!redirect.to || Object.prototype.hasOwnProperty.call(redirects, redirect.to) || !byId.has(redirect.to)) throw new Error("Identity redirect không hợp lệ: " + id);
    return redirect.to;
  };
  const emit = (inputId, fields) => {
    if (!fields.some(value => normalize(value).includes(query))) return;
    const mainId = resolve(inputId);
    const main = byId.get(mainId);
    if (!main) throw new Error("Identity target bị thiếu: " + mainId);
    const key = book.slug + "|" + mainId;
    if (emitted.has(key)) return;
    emitted.add(key);
    const identities = Array.isArray(main.thanPhanKhac) ? main.thanPhanKhac : [];
    output.push({ type: "Nhân vật", name: main.name, bo: book.ten,
      link: "bo.html?bo=" + book.slug + "&char=" + encodeURIComponent(mainId) + "#nhan-vat",
      aliases: (main.aliases || []).concat(identities.map(x => x && x.name).filter(Boolean)).join(", ") });
  };
  for (const c of chars) {
    if (!c || typeof c.id !== "string") continue;
    const identities = Array.isArray(c.thanPhanKhac) ? c.thanPhanKhac : [];
    emit(c.id, [c.id, c.name, ...(c.aliases || []), ...identities.flatMap(x => [x && x.name, ...((x && x.aliases) || []), ...((x && x.oldIds) || [])]), c.vaiTro || ""].filter(Boolean));
  }
  for (const oldId of Object.keys(redirects).sort()) emit(oldId, [oldId]);
  return output;
}

function searchIndexResults(book, index, query) {
  const LINK = {
    "Nhân vật": id => "bo.html?bo=" + book.slug + "&char=" + encodeURIComponent(id) + "#nhan-vat",
    "Pháp bảo": id => "bo.html?bo=" + book.slug + "&artifact=" + encodeURIComponent(id) + "#phap-bao",
    "Công pháp": id => "bo.html?bo=" + book.slug + "&tech=" + encodeURIComponent(id) + "#cong-phap",
    "Cảnh giới": id => "bo.html?bo=" + book.slug + "&realm=" + encodeURIComponent(id) + "#canh-gioi",
    "Địa điểm": id => "bo.html?bo=" + book.slug + "&place=" + encodeURIComponent(id) + "#map",
    "Thế lực": id => "bo.html?bo=" + book.slug + "&faction=" + encodeURIComponent(id) + "#the-luc"
  };
  return (index || []).filter(it => {
    const fields = [it.n, ...((it && it.a) || [])].filter(Boolean);
    return fields.some(value => normalize(value).includes(query));
  }).map(it => ({
    type: it.t, name: it.n, bo: book.ten,
    link: LINK[it.t] ? LINK[it.t](it.id) : "bo.html?bo=" + book.slug,
    aliases: (it.a || []).join(", ")
  }));
}

function shardSearchResults(book, index, query) {
  return searchIndexResults(book, index, query);
}

function search(query) {
  const q = normalize(query);
  if (!q) return [];
  const results = [];
  const DATA = window.LIB_DATA || {};
  const CT = window.LIB_COTTRUYEN || {};

  for (const b of boList) {
    if (SEARCH_INDEX.has(b.slug)) {
      results.push(...shardSearchResults(b, SEARCH_INDEX.get(b.slug), q));
      continue;
    }
    const d = DATA[b.slug];
    if (!d) continue;
    const boName = b.ten;
    const boSlug = b.slug;

    // Characters — resolve redirect trực tiếp rồi dedupe theo book_slug + main ID.
    if (d.characters && d.characters.chars) {
      results.push(...characterSearchResults(b, d.characters, q));
    }

    // Artifacts — dẫn thẳng tới drawer
    if (d.artifacts && d.artifacts.artifacts) {
      d.artifacts.artifacts.forEach((a, i) => {
        const fields = [a.name, ...(a.aliases || [])];
        if (fields.some(f => normalize(f).includes(q))) {
          results.push({ type: "Pháp bảo", name: a.name, bo: boName, link: "bo.html?bo=" + boSlug + "&artifact=" + encodeURIComponent(a.id != null ? a.id : i) + "#phap-bao", aliases: (a.aliases||[]).join(", ") });
        }
      });
    }

    // Techniques — dẫn thẳng tới drawer
    if (d.techniques && d.techniques.techniques) {
      d.techniques.techniques.forEach((t, i) => {
        const fields = [t.name, ...(t.aliases || [])];
        if (fields.some(f => normalize(f).includes(q))) {
          results.push({ type: "Công pháp", name: t.name, bo: boName, link: "bo.html?bo=" + boSlug + "&tech=" + encodeURIComponent(t.id != null ? t.id : i) + "#cong-phap", aliases: (t.aliases||[]).join(", ") });
        }
      });
    }

    // Realms — dẫn thẳng tới drawer
    if (d.realms && d.realms.realms) {
      for (const r of d.realms.realms) {
        if ([r.name, ...(r.aliases || [])].some(f => normalize(f).includes(q))) {
          results.push({ type: "Cảnh giới", name: r.name, bo: boName, link: "bo.html?bo=" + boSlug + "&realm=" + encodeURIComponent(r.id) + "#canh-gioi" });
        }
      }
    }

    // Map (địa danh) — key đúng là map.nodes; dẫn thẳng tới node
    if (d.map && d.map.nodes) {
      for (const p of d.map.nodes) {
        if ([p.name, ...(p.aliases || [])].some(f => normalize(f).includes(q))) {
          results.push({ type: "Địa điểm", name: p.name, bo: boName, link: "bo.html?bo=" + boSlug + "&place=" + encodeURIComponent(p.id) + "#map" });
        }
      }
    }

    // Factions
    if (d.factions && d.factions.factions) {
      for (const f of d.factions.factions) {
        const fields = [f.name, ...(f.aliases || [])];
        if (fields.some(x => normalize(x).includes(q))) {
          results.push({ type: "Thế lực", name: f.name, bo: boName, link: "bo.html?bo=" + boSlug + "&faction=" + encodeURIComponent(f.id || "") + "#the-luc", aliases: (f.aliases||[]).join(", ") });
        }
      }
    }

    // Cốt truyện — builder hiện gắn vào LIB_DATA[slug].cotTruyen theo từng quyển.
    const ct = (d.cotTruyen && typeof d.cotTruyen === "object") ? d.cotTruyen : CT[boSlug];
    const episodes = Array.isArray(ct) ? ct : (ct && typeof ct === "object" ? Object.values(ct).flatMap(x => Array.isArray(x) ? x : []) : []);
    for (const ep of episodes) {
      const tieuDe = ep.tieuDe || ep.title || "";
      const tomTat = ep.tomTat || ep.summary || "";
      if (normalize(tieuDe).includes(q) || normalize(tomTat).includes(q)) {
        results.push({ type: "Cốt truyện", name: tieuDe || tomTat.slice(0, 60), bo: boName, link: "bo.html?bo=" + boSlug + "#cot-truyen" });
      }
    }
  }

  return results;
}

function renderResults(results, query) {
  const el = document.getElementById("results");
  if (!query) { el.innerHTML = '<p style="color:var(--muted)">Nhập từ khoá để tìm kiếm.</p>'; return; }
  if (results.length === 0) {
    el.innerHTML = '<p style="color:var(--muted)">Không tìm thấy kết quả cho "<b>' + esc(query) + '</b>".</p>';
    return;
  }

  // Group by type
  const groups = {};
  for (const r of results) {
    if (!groups[r.type]) groups[r.type] = [];
    groups[r.type].push(r);
  }

  let html = '<p style="color:var(--muted);margin-bottom:16px">Tìm thấy <b>' + results.length + '</b> kết quả cho "<b>' + esc(query) + '</b>"</p>';

  for (const [type, items] of Object.entries(groups)) {
    html += '<h3 style="color:var(--gold2);margin:18px 0 8px;font-family:var(--display)">' + esc(type) + ' (' + items.length + ')</h3>';
    for (const item of items) {
      html += '<a href="' + esc(item.link) + '" class="search-result">';
      html += '<span class="sr-name">' + esc(item.name) + '</span>';
      if (item.aliases) html += '<span class="sr-alias">' + esc(item.aliases) + '</span>';
      html += '<span class="sr-bo">' + esc(item.bo) + '</span>';
      html += '</a>';
    }
  }

  el.innerHTML = html;
}

const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function doSearch() {
  const q = document.getElementById("searchInput").value.trim();
  if (q) {
    history.replaceState(null, "", "search.html?q=" + encodeURIComponent(q));
  }
  const results = search(q);
  renderResults(results, q);
}

function initSearch() {
  const params = new URLSearchParams(location.search);
  const q = params.get("q") || "";
  const inp = document.getElementById("searchInput");
  inp.value = q;
  if (q) doSearch();

  let tmr = null;
  inp.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(doSearch, 120); });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(tmr); doSearch(); } });
  document.getElementById("searchBtn").addEventListener("click", doSearch);
}

loadAllData().then(initSearch).catch(err => {
  document.getElementById("results").innerHTML = '<p role="alert" style="color:var(--chu2)">Không tải được dữ liệu tìm kiếm. Vui lòng thử lại sau.</p>';
  console.error(err);
});
</script>
